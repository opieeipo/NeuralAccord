[project]
name = "neural-accord"
version = "0.0.0"
description = "An open research platform for investigating how adaptive coordination develops, persists, and becomes historically opaque under biologically motivated neural constraints."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "computational-neuroscience",
    "emergent-communication",
    "synaptic-plasticity",
    "brain-computer-interface",
    "reproducibility",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Level 0 (functional baseline) runs on this set alone: no GPU, no cloud, no
# opaque framework. Everything heavier is an optional extra below.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "omegaconf>=2.3",
    "duckdb>=1.1",
    "babel>=2.16",
]

[project.optional-dependencies]
spiking = ["brian2>=2.7"]
gpu = ["brian2cuda>=1.0b1"]
circuit = ["bmtk>=1.1", "neuron>=8.2"]
bci = ["pynwb>=2.8"]
viz = ["matplotlib>=3.9"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
neural-accord = "core.cli:main"

[project.urls]
Repository = "https://github.com/opieeipo/NeuralAccord"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The repository layout is the one declared in the README, not src/.
packages = ["core", "experiments"]

[tool.hatch.build.targets.wheel.force-include]
"locales" = "core/locales"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["brian2.*", "brian2cuda.*", "bmtk.*", "neuron.*", "pynwb.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: sweeps or simulations too long for the default suite",
    "spiking: requires the optional brian2 backend",
    "bci: requires a permitted neural dataset to be present locally",
]
