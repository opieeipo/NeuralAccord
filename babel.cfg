# Babel extraction map. Regenerate the source catalog with:
#
#   uv run pybabel extract -F babel.cfg -o locales/neural_accord.pot .
#   uv run pybabel update  -i locales/neural_accord.pot -d locales -D neural_accord
#   uv run pybabel compile -d locales -D neural_accord
#
# Compiled .mo files are build artifacts and are not tracked.

[python: core/**.py]
[python: experiments/**.py]
